name: Backup DB

# Backup diario de Supabase (Postgres + archivos de Storage) cifrado con age
# hacia Cloudflare R2. Reemplaza el backup semanal a Gist, que cubria 7 de 36
# tablas y las dejaba en texto plano.
#
# Corre en Actions y no en Railway a proposito: si el backup viviera en la
# misma cuenta que la app, un problema de facturacion o un borrado accidental
# se llevaria la app y sus respaldos juntos.
#
# Este workflow NO puede descifrar nada: solo conoce la clave publica. La
# verificacion de restauracion corre aparte, donde vive la clave privada
# (ver docs/runbook-restore.md).

on:
  schedule:
    # 08:05 UTC = 03:05 Lima. Minuto no redondo: los cron en punto son los mas
    # congestionados en Actions y se atrasan mas.
    - cron: '5 8 * * *'
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pg_dump tiene que ser >= al servidor. Ubuntu trae 16; produccion corre
      # 17.6, y pg_dump 16 se niega a dumpear un servidor 17.
      # timeout propio: si los mirrors de apt se cuelgan, este paso tiene que
      # morir solo y dejar tiempo de job para que el aviso salga, en vez de
      # consumir los 20 minutos completos esperando (paso el 2026-08-19).
      - name: Instalar postgresql-client-17 y age
        timeout-minutes: 6
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # Sin timeout explicito apt espera minutos por mirror y se come el paso
          # entero sin imprimir una linea. Y sin quitarle el -qq no se sabe cual de
          # los dos comandos fue: los dos cuelgues del 19-ago no dejaron rastro.
          APT='-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2'
          for i in 1 2 3; do
            echo "== intento $i"
            if sudo apt-get $APT update && \
               sudo apt-get $APT install -y postgresql-client-17 age; then
              ok=1; break
            fi
            echo "== intento $i fallo; reintento en 15s"
            sleep 15
          done
          [ "${ok:-}" = 1 ] || { echo "apt no pudo instalar en 3 intentos"; exit 1; }
          # El pg_dump del PATH es el wrapper de Debian y apunta al 16 de Ubuntu:
          # imprimia "16.14" y se leia como verificacion, mientras el backup usa
          # $PG_BIN/pg_dump (el 17). Verificar el binario que de verdad se usa, o
          # el dia que postgresql-client-17 no se instale el paso pasa verde igual.
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version

      - name: Correr backup
        env:
          # Session pooler (puerto 5432). La conexion directa de Supabase es
          # solo IPv6 y los runners de GitHub son solo IPv4: falla siempre.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PG_BIN: /usr/lib/postgresql/17/bin
          RESUMEN_OUT: ${{ runner.temp }}/resumen.json
        run: bash scripts/backup/backup.sh

      # Que el job termine verde no prueba que el objeto quedo en R2 ni que
      # tenga sentido: eso se comprueba leyendo el bucket de vuelta.
      - name: Verificar frescura y tamano en R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/backup/check-frescura.mjs

      # Confirmacion de que el backup del dia si se hizo. Un sistema que solo
      # avisa cuando falla es indistinguible de uno que dejo de correr.
      # Para apagarlo: variable de repo NOTIFICAR_EXITO = false.
      - name: Avisar exito por Telegram
        if: vars.NOTIFICAR_EXITO != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RESUMEN: ${{ runner.temp }}/resumen.json
        run: bash scripts/backup/notificar.sh ok

  # Sin esto, un fallo del backup es un correo de GitHub que se pierde entre
  # otros. Telegram es el canal donde Favio si mira las alertas de Neto.
  #
  # La condicion NO es failure(): un job cancelado por timeout no la dispara.
  # El 2026-08-19 el paso de instalacion se colgo 20 min contra apt, el job
  # quedo 'cancelled' y no salio ni el verde ni el rojo: silencio, que es
  # indistinguible de un backup que si corrio. Preguntar por el resultado
  # del job cubre failure, cancelled y skipped de una sola vez.
  avisar-si-falla:
    needs: backup
    if: always() && needs.backup.result != 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Avisar fallo por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: bash scripts/backup/notificar.sh falla
