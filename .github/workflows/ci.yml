name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
    env:
      NODE_ENV: test
      # Variables requeridas por lib/config.js
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      META_ACCESS_TOKEN: test
      META_PHONE_NUMBER_ID: test
      META_VERIFY_TOKEN: test
      ADMIN_KEY: test
      ADMIN_WHATSAPP: test

  # La webapp tiene su propio package.json, su propio lockfile y sus propios 149
  # tests, y hasta hoy no corrian en ningun lado: el job `test` de arriba corre en
  # la raiz, donde `vitest run` solo ve `tests/**` del backend. O sea que TODO el
  # cinturon de la webapp —requireNetoUser, lectura-callsites, spaces-split,
  # auth-callsites— era verde solo cuando alguien se acordaba de correrlo a mano.
  #
  # Ojo con lo que este job SI y NO hace: da el check rojo en el commit, pero
  # Vercel despliega igual (su integracion de Git no espera checks de Actions).
  # Gatear el deploy de verdad seria un "Ignored Build Step" en Vercel, que es
  # config de la plataforma, no de este archivo. Ver deploy-config.json.
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # tsc va aparte de los tests a proposito: vitest transpila sin chequear
      # tipos, asi que una suite verde no dice nada sobre `tsc`. Los dos fallos
      # se ven en la misma corrida (`--noEmit` no escribe nada).
      - run: npx tsc --noEmit
      - run: npm run test

  nlp-agent:
    needs: test
    # STANDBY 2026-07-14: NLP Agent pausado mientras iteramos cambios seguidos
    # (evita gastar créditos OpenAI ~300 llamadas en cada push). Re-activar:
    # quitar "false &&" de la línea de abajo.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run NLP Agent (300 cases)
        run: npm run test:nlp-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_VERIFY_TOKEN: test
          ADMIN_KEY: test
          ADMIN_WHATSAPP: ${{ secrets.ADMIN_WHATSAPP }}
