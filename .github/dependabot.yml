# Security updates only. Version-bump PRs are off (open-pull-requests-limit: 0):
# from March to October 2026 six of them sat open unread, hit the limit, and
# Dependabot stopped opening anything. Security PRs ignore that limit and come
# grouped, one PR per directory, so each one is worth reading.
# Patch policy (which advisories get fixed when): workspace CLAUDE.md, "Dependencias".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
